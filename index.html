<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>수라 전투부대</title>

<style>
body{
  margin:0;
  background:#080b10;
  color:#eee;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif
}

main{
  max-width:760px;
  margin:auto;
  padding:24px 16px 60px
}

.card{
  background:#111821;
  border:1px solid #303a48;
  border-radius:22px;
  padding:20px;
  margin:18px 0
}

h1{
  font-size:30px
}

h2{
  margin-top:0
}

button{
  border:0;
  border-radius:14px;
  padding:15px 20px;
  font-size:17px;
  font-weight:700;
  background:#d6ae59;
  color:#111;
  margin:5px
}

button.secondary{
  background:#263446;
  color:white
}

input,textarea{
  width:100%;
  box-sizing:border-box;
  background:#070b10;
  color:#eee;
  border:1px solid #344050;
  border-radius:12px;
  padding:14px;
  font-size:16px
}

img{
  max-width:100%;
  max-height:400px;
  display:block;
  margin:15px auto;
  border-radius:14px
}

.progress{
  height:12px;
  background:#263446;
  border-radius:20px;
  overflow:hidden
}

.bar{
  height:100%;
  width:0;
  background:#d6ae59;
  transition:.25s
}

.status{
  color:#d6ae59;
  font-weight:700;
  margin:10px 0
}

#errorBox{
  display:none;
  white-space:pre-wrap;
  word-break:break-word;
  background:#180d0d;
  border:1px solid #7d3333;
  color:#ffb5b5;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.5
}
</style>
</head>

<body>

<main>

<h1>수라 전투부대</h1>

<div>
스크린샷 → AI 전체 화면 판독 → 검토 → 저장
</div>

<section class="card">

<h2>① 사진 선택</h2>

<input id="file" type="file" accept="image/*">

<img id="preview" hidden>

<button id="run">
화면 판독 시작
</button>

<button
class="secondary"
onclick="location.reload()">
초기화
</button>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div id="status" class="status">
대기 중
</div>

<div id="errorBox"></div>

</section>


<section class="card">

<h2>② 판독 결과</h2>

<textarea
id="result"
rows="28"
placeholder="판독 결과가 여기에 표시됩니다.">
</textarea>

<button id="save">
검토 내용 저장
</button>

</section>


<section class="card">

<h2>③ 전투 구분</h2>

<label>
<input
type="radio"
name="type"
value="승리"
checked>
승리
</label>

<label>
<input
type="radio"
name="type"
value="멸망">
멸망
</label>

</section>

</main>


<script>

const $ = x => document.getElementById(x);

let data = null;


/* ----------------------------------
   이미지 선택
---------------------------------- */

$("file").onchange = e => {

  const f = e.target.files[0];

  if (!f) return;

  const r = new FileReader();

  r.onload = () => {

    data = r.result;

    $("preview").src = data;

    $("preview").hidden = false;

    $("status").textContent =
      "사진 준비 완료";

    $("errorBox").style.display =
      "none";
  };

  r.readAsDataURL(f);
};


/* ----------------------------------
   진행률
---------------------------------- */

function p(n, t){

  $("bar").style.width =
    n + "%";

  $("status").textContent =
    n + "% · " + t;
}


/* ----------------------------------
   오류 표시
---------------------------------- */

function showError(message){

  $("errorBox").textContent =
    message;

  $("errorBox").style.display =
    "block";
}


/* ----------------------------------
   AI 분석
---------------------------------- */

$("run").onclick = async () => {

  if (!data){

    alert(
      "스크린샷을 먼저 선택하세요."
    );

    return;
  }

  $("errorBox").style.display =
    "none";

  $("result").value = "";

  try {

    p(
      10,
      "이미지 준비 중"
    );


    /*
      data:image/jpeg;base64,...
      형태 그대로 서버에 전달
    */

    p(
      30,
      "AI에 전체 화면 전달 중"
    );


    const response =
      await fetch(
        "/api/analyze",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            image:data,

            mimeType:
              data.startsWith(
                "data:image/png"
              )
              ? "image/png"
              : "image/jpeg"

          })
        }
      );


    /*
      서버 응답을 일단 TEXT로 받는다.
      JSON이 아니어도 실제 오류 내용을
      확인할 수 있게 하기 위함.
    */

    const responseText =
      await response.text();


    let j;

    try{

      j =
        JSON.parse(
          responseText
        );

    }catch(e){

      throw new Error(
        "서버가 JSON이 아닌 응답을 보냈습니다.\n\n" +
        "HTTP 상태: " +
        response.status +
        "\n\n" +
        responseText.substring(
          0,
          2000
        )
      );
    }


    /* ----------------------------------
       서버 오류
    ---------------------------------- */

    if(!response.ok){

      const message =

        "Gemini API 오류\n\n" +

        "HTTP 코드: " +
        (
          j.code ||
          response.status ||
          "알 수 없음"
        ) +

        "\n\n상태: " +
        (
          j.status ||
          "알 수 없음"
        ) +

        "\n\n상세 내용:\n" +
        (
          j.detail ||
          j.error ||
          "상세 오류가 없습니다."
        ) +

        (
          j.model
          ? "\n\n사용 모델: " +
            j.model
          : ""
        );

      throw new Error(
        message
      );
    }


    /* ----------------------------------
       정상 응답
    ---------------------------------- */

    p(
      85,
      "전투 정보 정리 중"
    );


    /*
      analyze.js에서는
      result라는 이름으로 결과를 보냄
    */

    const result =
      j.result ||
      j.text ||
      "";


    if(!result){

      throw new Error(
        "Gemini가 분석 결과를 반환하지 않았습니다.\n\n" +
        JSON.stringify(
          j,
          null,
          2
        )
      );
    }


    $("result").value =
      result;


    p(
      100,
      "판독 완료"
    );


  }catch(e){

    p(
      0,
      "오류"
    );


    showError(
      e.message ||
      String(e)
    );

  }

};


/* ----------------------------------
   저장
---------------------------------- */

$("save").onclick = () => {

  const t =
    $("result").value.trim();

  if(!t){

    alert(
      "결과가 없습니다."
    );

    return;
  }


  const k =
    "sura-records";


  const a =
    JSON.parse(
      localStorage.getItem(k) ||
      "[]"
    );


  a.push({

    type:
      document.querySelector(
        "[name=type]:checked"
      ).value,

    text:t,

    time:
      new Date().toISOString()

  });


  localStorage.setItem(
    k,
    JSON.stringify(a)
  );


  alert(
    "저장했습니다."
  );

};

</script>

</body>
</html>
