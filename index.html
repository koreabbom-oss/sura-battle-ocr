<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>수라 전투부대</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:#f1f1f1;
  background:
    radial-gradient(circle at top,#20252d 0,#0b0e12 45%,#06080b 100%);
  font-family:
    system-ui,
    -apple-system,
    "Noto Sans KR",
    sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    linear-gradient(45deg,#fff 25%,transparent 25%),
    linear-gradient(-45deg,#fff 25%,transparent 25%);
  background-size:4px 4px;
}

main{
  width:min(100%,980px);
  margin:auto;
  padding:24px 16px 80px;
}

/* ================================
   HEADER
================================ */

.header{
  position:relative;
  padding:34px 28px;
  margin-bottom:20px;
  border:1px solid #3b3b32;
  border-radius:24px;
  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(55,45,25,.95),
      rgba(15,18,22,.98)
    );

  box-shadow:
    0 20px 50px rgba(0,0,0,.35);
}

.header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-50px;
  top:-60px;
  border-radius:50%;
  border:1px solid rgba(214,174,89,.2);
  box-shadow:
    0 0 0 25px rgba(214,174,89,.04),
    0 0 0 50px rgba(214,174,89,.025);
}

.logo{
  color:#d6ae59;
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:7px;
}

.header h1{
  margin:0;
  font-size:34px;
  letter-spacing:-1px;
}

.header p{
  margin:8px 0 0;
  color:#aeb5bd;
  font-size:14px;
}

/* ================================
   CARD
================================ */

.card{
  position:relative;
  background:rgba(16,21,27,.94);
  border:1px solid #2b333d;
  border-radius:20px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.card-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.card-title .mark{
  width:5px;
  height:22px;
  border-radius:4px;
  background:#d6ae59;
}

.card-title h2{
  margin:0;
  font-size:19px;
}

.card-sub{
  color:#8f99a5;
  font-size:13px;
  margin-top:-10px;
  margin-bottom:16px;
}

/* ================================
   INPUT
================================ */

label{
  display:block;
  color:#aeb7c1;
  font-size:13px;
  font-weight:600;
  margin:5px 0;
}

input,
textarea,
select{
  width:100%;
  color:#f5f5f5;
  background:#080c10;
  border:1px solid #303b47;
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#c9a452;
  box-shadow:0 0 0 3px rgba(214,174,89,.08);
}

textarea{
  min-height:280px;
  resize:vertical;
}

/* ================================
   BUTTON
================================ */

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin:4px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  color:#17130b;
  background:linear-gradient(
    135deg,
    #e0bc69,
    #bd9342
  );
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

button.secondary{
  color:#e8edf2;
  background:#26313d;
}

button.danger{
  color:#fff;
  background:#6b3030;
}

/* ================================
   GRID
================================ */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:28px;
  }

  .header{
    padding:27px 20px;
  }
}

/* ================================
   USER BAR
================================ */

.userbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 16px;
  border-radius:14px;
  background:#0b1016;
  border:1px solid #29323c;
  margin-bottom:16px;
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:800;
}

.user-clan{
  color:#d6ae59;
  font-size:12px;
  margin-top:2px;
}

@media(max-width:550px){
  .userbar{
    align-items:flex-start;
    flex-direction:column;
  }
}

/* ================================
   PROGRESS
================================ */

.progress{
  height:9px;
  margin-top:14px;
  background:#252d36;
  border-radius:20px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(
    90deg,
    #9e782e,
    #e0bd68
  );
  transition:.25s;
}

.status{
  color:#d6ae59;
  font-size:13px;
  font-weight:800;
  margin-top:9px;
}

/* ================================
   IMAGE
================================ */

.preview{
  max-width:100%;
  max-height:460px;
  display:block;
  margin:16px auto;
  border-radius:15px;
  border:1px solid #303b45;
}

/* ================================
   RESULT
================================ */

.result-box{
  white-space:pre-wrap;
  word-break:break-word;
  background:#080c10;
  border:1px solid #303a44;
  border-radius:14px;
  padding:16px;
  line-height:1.7;
  min-height:180px;
  font-size:14px;
}

/* ================================
   SEARCH
================================ */

.search-box{
  position:relative;
}

.search-box input{
  padding-right:90px;
}

.search-button{
  position:absolute;
  right:5px;
  top:5px;
  bottom:5px;
  padding:0 15px;
  margin:0;
}

/* ================================
   RECORD
================================ */

.record{
  padding:16px;
  margin:10px 0;
  background:#0a0f14;
  border:1px solid #2b343e;
  border-radius:15px;
}

.record-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.record-result{
  font-weight:900;
  color:#d6ae59;
}

.record-meta{
  color:#9ca6b0;
  font-size:12px;
  margin-top:7px;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  margin:2px;
  border-radius:999px;
  background:#202b37;
  color:#cbd3db;
  font-size:11px;
}

details{
  margin-top:12px;
}

summary{
  cursor:pointer;
  color:#d6ae59;
  font-size:13px;
}

/* ================================
   MESSAGE
================================ */

.message{
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-size:13px;
  white-space:pre-wrap;
}

.success{
  color:#b9e7c9;
  background:#0d1a13;
  border:1px solid #315a42;
}

.error{
  color:#ffb7b7;
  background:#1b0d0d;
  border:1px solid #743737;
}

.hidden{
  display:none!important;
}

/* ================================
   ADMIN TABLE
================================ */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th,
td{
  padding:11px 8px;
  text-align:left;
  border-bottom:1px solid #29333d;
  font-size:13px;
}

th{
  color:#d6ae59;
}

/* ================================
   EMPTY
================================ */

.empty{
  padding:25px;
  text-align:center;
  color:#7f8a95;
  border:1px dashed #303944;
  border-radius:14px;
}

</style>
</head>

<!-- ==============================

<div>

>

<label>
상대

>

검색

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://wwztnwyhsxvumsnaifgd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JSjLC_CYnQkbsj6aLZv2Pw_CCPyNt0-";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   STATE
========================================== */

let imageData = null;

let currentUser = null;

let currentProfile = null;


/* ==========================================
   HELPERS
========================================== */

const $ =
id => document.getElementById(id);


function show(
  id,
  visible=true
){

  $(id)
    .classList
    .toggle(
      "hidden",
      !visible
    );

}


function message(
  id,
  text,
  type="success"
){

  const el = $(id);

  el.textContent = text;

  el.className =
    "message " + type;

}


function progress(
  n,
  text
){

  $("bar").style.width =
    n + "%";

  $("status").textContent =
    n + "% · " + text;

}


function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}


/* ==========================================
   SESSION
========================================== */

async function loadSession(){

  const {
    data:{
      session
    }
  } =
  await db.auth.getSession();


  if(session){

    await setUser(
      session.user
    );

  }else{

    resetUser();

  }

}


async function setUser(
  user
){

  currentUser =
    user;


  show(
    "authCard",
    false
  );

  show(
    "profileCard"
  );

  show(
    "searchCard"
  );

  show(
    "analysisCard"
  );

  show(
    "myBattlesCard"
  );


  const {
    data:profile,
    error
  } =
  await db
    .from("profiles")
    .select("*")
    .eq(
      "id",
      user.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "PROFILE ERROR",
      error
    );

  }


  currentProfile =
    profile;


  if(profile){

    $("nickname").value =
      profile.nickname || "";

    $("clanName").value =
      profile.clan_name || "";


    $("topUser").textContent =
      profile.nickname ||
      user.email;


    $("topClan").textContent =
      profile.clan_name ||
      "맹 미등록";


    if(
      profile.role ===
      "admin"
    ){

      show(
        "adminCard"
      );

      await loadAdmin();

    }

  }


  await loadMine();

}


function resetUser(){

  currentUser =
    null;

  currentProfile =
    null;


  show(
    "authCard"
  );


  [
    "profileCard",
    "searchCard",
    "analysisCard",
    "resultCard",
    "myBattlesCard",
    "adminCard"
  ].forEach(
    id =>
      show(
        id,
        false
      )
  );

}


/* ==========================================
   SIGN UP
========================================== */

$("signup").onclick =
async()=>{

  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  if(
    !email ||
    !password
  ){

    return message(
      "authMsg",
      "이메일과 비밀번호를 입력하세요.",
      "error"
    );

  }


  if(
    password.length < 6
  ){

    return message(
      "authMsg",
      "비밀번호는 6자 이상이어야 합니다.",
      "error"
    );

  }


  const {
    data,
    error
  } =
  await db.auth.signUp({

    email,

    password

  });


  if(error){

    return message(
      "authMsg",
      error.message,
      "error"
    );

  }


  if(data.session){

    await setUser(
      data.user
    );

    message(
      "authMsg",
      "회원가입 완료"
    );

  }else{

    message(
      "authMsg",
      "회원가입 완료. 이메일 인증이 필요한 경우 이메일을 확인하세요."
    );

  }

};


/* ==========================================
   LOGIN
========================================== */

$("login").onclick =
async()=>{

  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  const {
    data,
    error
  } =
  await db.auth.signInWithPassword({

    email,

    password

  });


  if(error){

    return message(
      "authMsg",
      error.message,
      "error"
    );

  }


  await setUser(
    data.user
  );

};


/* ==========================================
   LOGOUT
========================================== */

$("logout").onclick =
async()=>{

  await db.auth.signOut();

  location.reload();

};


/* ==========================================
   PROFILE
========================================== */

$("saveProfile").onclick =
async()=>{

  if(!currentUser)
    return;


  const nickname =
    $("nickname")
      .value
      .trim();


  const clan =
    $("clanName")
      .value
      .trim();


  if(!nickname){

    return message(
      "profileMsg",
      "닉네임을 입력하세요.",
      "error"
    );

  }


  const {
    error
  } =
  await db
    .from("profiles")
    .upsert({

      id:
        currentUser.id,

      nickname:
        nickname,

      clan_name:
        clan

    });


  if(error){

    return message(
      "profileMsg",
      error.message,
      "error"
    );

  }


  currentProfile = {

    ...(currentProfile || {}),

    nickname:
      nickname,

    clan_name:
      clan

  };


  $("topUser").textContent =
    nickname;

  $("topClan").textContent =
    clan ||
    "맹 미등록";


  message(
    "profileMsg",
    "내 정보를 저장했습니다."
  );

};


/* ==========================================
   IMAGE
========================================== */

$("file").onchange =
event=>{

  const file =
    event.target.files[0];


  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload =
  ()=>{

    imageData =
      reader.result;


    $("preview").src =
      imageData;


    $("preview").hidden =
      false;


    progress(
      0,
      "사진 준비 완료"
    );

  };


  reader.readAsDataURL(
    file
  );

};


/* ==========================================
   AI ANALYSIS
   기존 /api/analyze 그대로
========================================== */

$("run").onclick =
async()=>{

  if(!imageData){

    return alert(
      "스크린샷을 먼저 선택하세요."
    );

  }


  $("errorBox")
    .classList
    .add("hidden");


  try{

    progress(
      10,
      "이미지 준비 중"
    );


    progress(
      30,
      "AI에 전체 화면 전달 중"
    );


    const response =
      await fetch(
        "/api/analyze",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              image:
                imageData,

              mimeType:
                imageData.startsWith(
                  "data:image/png"
                )
                ?
                "image/png"
                :
                "image/jpeg"

            })

        }
      );


    const responseText =
      await response.text();


    let json;


    try{

      json =
        JSON.parse(
          responseText
        );

    }catch(e){

      throw new Error(
        "서버가 JSON이 아닌 응답을 보냈습니다.\n\n"+
        "HTTP: "+
        response.status+
        "\n\n"+
        responseText.slice(
          0,
          2000
        )
      );

    }


    if(!response.ok){

      throw new Error(

        "Gemini API 오류\n\n"+

        "HTTP: "+
        (
          json.code ||
          response.status
        )+

        "\n\n"+

        (
          json.detail ||
          json.error ||
          "알 수 없는 오류"
        )

      );

    }


    const result =
      json.result ||
      json.text ||
      "";


    if(!result){

      throw new Error(
        "Gemini가 분석 결과를 반환하지 않았습니다."
      );

    }


    $("result").value =
      result;


    show(
      "resultCard"
    );


    progress(
      100,
      "판독 완료"
    );


    window.scrollTo({
      top:
        $("resultCard")
          .offsetTop - 20,

      behavior:
        "smooth"
    });


  }catch(error){

    progress(
      0,
      "오류"
    );


    $("errorBox")
      .textContent =
      error.message ||
      String(error);


    $("errorBox")
      .classList
      .remove(
        "hidden"
      );

  }

};

/* ==========================================

function recordHTML(
  battle,
  owner=null
){

  const nickname =
    owner?.nickname;


  const clan =
    owner?.clan_name;


  return `

  <div class="record">

    <div class="record-head">

      <div>

        <span class="record-result">

          ${escapeHtml(
            battle.result ||
            "확인 불가"
          )}

        </span>

        ${
          nickname
          ?
          `
          <span class="tag">
            ${escapeHtml(
              nickname
            )}
          </span>
          `
          :
          ""
        }

        ${
          clan
          ?
          `
          <span class="tag">
            ${escapeHtml(
              clan
            )}
          </span>
          `
          :
          ""
        }

      </div>

      <div class="record-meta">

        ${new Date(
          battle.created_at
        ).toLocaleString(
          "ko-KR"
        )}

      </div>

    </div>


    <div>

      상대:
      <span class="tag">

        ${escapeHtml(
          battle.opponent_name ||
          "미입력"
        )}

      </span>

      <span class="tag">

        ${escapeHtml(
          battle.opponent_clan_name ||
          "맹 미입력"
        )}

      </span>

    </div>


    <details>

      <summary>
        전투 보고서 보기
      </summary>

      <div
        class="result-box"
        style="margin-top:10px"
      >

        ${escapeHtml(

async function searchUsers(
  keyword
){

  const {
    data,
    error
  } =
  await db
    .from("profiles")
    .select(
      "id,nickname,clan_name"
    )
    .or(
      `nickname.ilike.%${keyword}%,clan_name.ilike.%${keyword}%`
    )
    .limit(100);


  if(error){

    console.error(
      "USER SEARCH",
      error
    );

    return [];

  }


  return data || [];

}


/* ==========================================
   ★ 검색 결과
========================================== */

async function searchBattles(){

  const keyword =
    $("search")
      .value
      .trim();


  if(!keyword){

    return loadAllBattles();

  }


  $("searchResults")
    .innerHTML =
    `
    <div class="small">
      검색 중...
    </div>
    `;


  /*
   1.
   닉네임 / 맹 이름으로 유저 검색
  */

  const users =
    await searchUsers(
      keyword
    );


  const userIds =
    users.map(
      user =>
        user.id
    );


  /*
   2.
   해당 유저가 작성한 전투
  */

  let userBattles = [];


  if(userIds.length){

    const {
      data,
      error
    } =
    await db
      .from("battles")
      .select("*")
      .in(
        "user_id",
        userIds
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(500);


    if(!error){

      userBattles =
        data || [];

    }

  }


  /*
   3.
   상대 유저 / 상대 맹으로 검색
  */

  const {
    data:opponentBattles,
    error:opponentError
  } =
  await db
    .from("battles")
    .select("*")
    .or(
      `opponent_name.ilike.%${keyword}%,opponent_clan_name.ilike.%${keyword}%`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(500);


  if(opponentError){

    console.error(
      opponentError
    );

  }


  /*
   4.
   중복 제거
  */

  const map =
    new Map();


  [
    ...userBattles,
    ...(opponentBattles || [])
  ].forEach(
    battle => {

      map.set(
        battle.id,
        battle
      );

    }
  );


  const battles =
    Array.from(
      map.values()
    );


  if(!battles.length){

    $("searchResults")
      .innerHTML =
      `
      <div class="empty">
        "${escapeHtml(
          keyword
        )}" 검색 결과가 없습니다.
      </div>
      `;

    return;

  }


  /*
   5.
   작성자 프로필 가져오기
  */

  const ids =
    [
      ...new Set(
        battles.map(
          b =>
            b.user_id
        )
      )
    ];


  const {
    data:profiles
  } =
  await db
    .from("profiles")
    .select(
      "id,nickname,clan_name"
    )
    .in(
      "id",
      ids
    );


  const profileMap =
    new Map(
      (profiles || [])
        .map(
          p =>
            [
              p.id,
              p
            ]
        )
    );


  /*
   6.
   화면 표시
  */

  $("searchResults")
    .innerHTML =
    battles
      .sort(
        (a,b)=>
          new Date(
            b.created_at
          ) -
          new Date(
            a.created_at
          )
      )
      .map(
        battle =>
          recordHTML(
            battle,
            profileMap.get(
              battle.user_id
            )
          )
      )
      .join("");

}
